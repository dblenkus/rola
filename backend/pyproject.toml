[build-system]
requires = ["setuptools>=84,<85", "setuptools-scm>=10.2.3,<11"]
build-backend = "setuptools.build_meta"

[project]
name = "rolca"
dynamic = ["version"]
description = "Open source platform for organising photography contests"
readme = "README.rst"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Domen Blenkuš", email = "domen@blenkus.com"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "boto3>=1.43.96,<1.44",
    "channels>=4.3.2,<5",
    "channels-redis>=4.3,<5",
    "Django>=6.1.1,<6.2",
    "djangorestframework>=3.18.1,<3.19",
    "django-filter>=26.1,<27",
    "Pillow>=12.3,<13",
    "psycopg[binary]>=3.3.5,<4",
]

[project.urls]
Homepage = "https://github.com/dblenkus/rolca"

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "pytest-django>=4.14,<5", "pytest-cov>=7.1,<8"]
docs = ["Sphinx>=9.1,<10", "sphinx-rtd-theme>=3.1,<4"]
package = ["build>=1.6.1,<2", "twine>=7,<8", "check-manifest>=0.51,<1", "tox>=4.61.5,<5"]
lint = ["black>=26.5.1,<27", "flake8>=7.3,<8", "isort>=9.0.1,<10", "ruff>=0.16.8,<0.17"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"rolca.core" = ["locale/sl/LC_MESSAGES/django.*"]

[tool.setuptools_scm]

[tool.black]
target-version = ["py312"]
skip-string-normalization = true
extend-exclude = "/migrations/"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["src/rolca", "tests"]
markers = ["redis: integration test requiring ROLCA_REDIS_URL"]

[tool.isort]
profile = "black"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "DJANGO", "DJANGOTHIRD", "FIRSTPARTY", "LOCALFOLDER"]
known_django = ["django"]
known_djangothird = ["rest_framework"]
known_first_party = ["rolca", "tests"]
skip_glob = ["*/migrations/*"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["**/migrations/**", "**/tests/**"]

[tool.ruff.lint]
select = ["D"]
ignore = ["D202"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
