[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rola"
version = "0.1.0"
description = "Photography contest platform"
readme = "README.rst"
requires-python = ">=3.14"
license = "AGPL-3.0-only AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE-AGPL", "licenses/*"]
authors = [{name = "Domen Blenkuš", email = "domen@blenkus.com"}]
dependencies = [
    "Django>=6.1.3,<6.2",
    "django-filter>=26.2,<27",
    "django-storages[s3]>=1.14.6,<2",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=27.0.0,<28",
    "Pillow>=13.0,<14",
    "psycopg[binary]>=3.3.9,<4",
]

[project.urls]
Homepage = "https://github.com/dblenkus/rola"

[dependency-groups]
test = ["pytest>=9.2,<10", "pytest-django>=4.14,<5"]
lint = [
    "ruff>=0.17.5,<0.18",
    "mypy>=2.4,<3",
    "django-stubs>=6.1.2,<6.2",
    "djangorestframework-stubs>=3.18.2,<3.19",
]
docs = ["Sphinx>=9.2,<10", "sphinx-rtd-theme>=3.1,<4"]

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools.packages.find]
include = ["rola*"]

[tool.setuptools.package-data]
"rola" = ["locale/sl/LC_MESSAGES/django.*"]
"rola.accounts" = ["templates/**/*.txt", "templates/**/*.html"]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "rola.config.test_settings"
django_find_project = false
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]
strict = true
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::django.core.paginator.UnorderedObjectListWarning",
]

[tool.ruff]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["E501", "D202"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.14"
packages = ["rola"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# The flags of --strict. mypy applies `strict = true` in an override to
# every module, so the strict modules list the flags one by one.
[[tool.mypy.overrides]]
module = [
    "rola.config.*",
    "rola.common.*",
    "rola.accounts.settings",
    "rola.accounts.services",
    "rola.accounts.forms",
    "rola.accounts.api.throttling",
    "rola.entries.services",
    "rola.entries.photos",
    "rola.entries.archive",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

# botocore ships no type information, so mypy reads its source.
[[tool.mypy.overrides]]
module = ["botocore.*"]
follow_untyped_imports = true

# django-filter ships no type information either, and its rest_framework
# module computes __all__ at runtime, which mypy cannot read from source.
[[tool.mypy.overrides]]
module = ["django_filters.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "rola.config.test_settings"
