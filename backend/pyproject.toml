[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "rola"
version = "0.1.0"
description = "Photography contest platform"
readme = "README.rst"
requires-python = ">=3.14"
license = "AGPL-3.0-only AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSE-AGPL", "drf_user/LICENSE"]
authors = [{name = "Domen Blenkuš", email = "domen@blenkus.com"}]
dependencies = [
    "Django>=6.1.3,<6.2",
    "django-filter>=26.2,<27",
    "django-storages[s3]>=1.14.6,<2",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.30,<0.31",
    "gunicorn>=26.2,<27",
    "Pillow>=13.0,<14",
    "psycopg[binary]>=3.3.6,<4",
]

[project.urls]
Homepage = "https://github.com/dblenkus/rola"

[dependency-groups]
test = ["pytest>=9.2,<10", "pytest-django>=4.14,<5"]
lint = [
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4,<3",
    "django-stubs>=6.1.2,<6.2",
    "djangorestframework-stubs>=3.18.1,<3.19",
]
docs = ["Sphinx>=9.2,<10", "sphinx-rtd-theme>=3.1,<4"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { django = false }

[tool.setuptools.packages.find]
include = ["rola*", "rolca*", "drf_user*", "utils*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"rolca.core" = ["locale/sl/LC_MESSAGES/django.*"]
"drf_user" = ["templates/**/*.txt", "templates/**/*.html"]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "rola.test_settings"
django_find_project = false
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["drf_user/tests", "rolca", "tests"]
strict = true
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::django.core.paginator.UnorderedObjectListWarning",
]

[tool.ruff]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["E501", "D202"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"!rolca/**" = ["D"]
"**/tests/**" = ["D"]

[tool.mypy]
python_version = "3.14"
files = ["rola/environment.py", "drf_user/settings.py", "drf_user/throttling.py"]
strict = true
