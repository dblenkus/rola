openapi: 3.0.3
info:
  title: Rola API
  version: 1.0.0
  description: Accounts, photography contests, submissions, judging and payments.
paths:
  /api/v1/activations:
    post:
      operationId: activations_create
      description: Activate the account that the token names.
      tags:
      - activations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/authors:
    post:
      operationId: authors_create
      description: Create an author of the requester's submissions.
      tags:
      - authors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
          description: ''
  /api/v1/contests:
    get:
      operationId: contests_list
      description: List and retrieve contests with their themes.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - contests
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContestList'
          description: ''
  /api/v1/contests/{id}:
    get:
      operationId: contests_retrieve
      description: List and retrieve contests with their themes.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this contest.
        required: true
      tags:
      - contests
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contest'
          description: ''
  /api/v1/files:
    post:
      operationId: files_create
      description: Upload a photograph for a later submission.
      parameters:
      - in: header
        name: Content-Disposition
        schema:
          type: string
        description: Names the photograph, for example attachment; filename="photo.jpg".
        required: true
      tags:
      - files
      requestBody:
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
          description: ''
  /api/v1/institutions:
    get:
      operationId: institutions_list
      description: List institutions.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - institutions
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstitutionList'
          description: ''
  /api/v1/judging/contests:
    get:
      operationId: judging_contests_list
      description: List contests assigned to the requesting judge.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - judging
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJudgeContestList'
          description: ''
  /api/v1/judging/ratings:
    get:
      operationId: judging_ratings_list
      description: List the caller's ratings and set the caller's rating of a submission.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: submission
        schema:
          type: integer
      - in: query
        name: theme
        schema:
          type: integer
      tags:
      - judging
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRatingList'
          description: ''
  /api/v1/judging/ratings/{submission}:
    put:
      operationId: judging_ratings_update
      description: |-
        Set the caller's rating of a submission, creating it if needed.

        Answers 201 when the rating is created and 200 when it existed, 404
        when the caller cannot rate the submission as a judge, and 403 once
        the contest's results are published.
      parameters:
      - in: path
        name: submission
        schema:
          type: integer
        description: The id of the submission that the rating is for.
        required: true
      tags:
      - judging
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          description: The caller's rating, replaced.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
          description: The caller's rating, created.
    delete:
      operationId: judging_ratings_destroy
      description: |-
        Clear the caller's rating of a submission, if there is one.

        Answers 204 whether or not the rating existed, and otherwise as the
        PUT: 404 when the caller cannot rate the submission as a judge, and
        403 once the contest's results are published.
      parameters:
      - in: path
        name: submission
        schema:
          type: integer
        description: The id of the submission that the rating is for.
        required: true
      tags:
      - judging
      security:
      - tokenAuth: []
      responses:
        '204':
          description: The caller has no rating of the submission.
  /api/v1/judging/submissions:
    get:
      operationId: judging_submissions_list
      description: List paid submissions assigned to an active judge.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: theme
        schema:
          type: integer
      tags:
      - judging
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJudgeSubmissionList'
          description: ''
  /api/v1/password-reset-requests:
    post:
      operationId: password_reset_requests_create
      description: Email a reset link to an active account, answering alike for any
        address.
      tags:
      - password-reset-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/password-resets:
    post:
      operationId: password_resets_create
      description: Consume a reset token and set the new password.
      tags:
      - password-resets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/payments:
    get:
      operationId: payments_list
      description: List payments and set a submission set's payment, for superusers.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: submission_set__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - payments
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentList'
          description: ''
  /api/v1/payments/{submission_set}:
    put:
      operationId: payments_update
      description: |-
        Set whether a submission set is paid, creating its payment if needed.

        Answers 201 when the payment is created and 200 when it existed.
      parameters:
      - in: path
        name: submission_set
        schema:
          type: integer
        description: The id of the submission set that the payment is for.
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: The set's payment, updated.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: The set's payment, created.
  /api/v1/results/submissions:
    get:
      operationId: results_submissions_list
      description: List and retrieve the paid submissions of published theme results.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: theme
        schema:
          type: integer
      tags:
      - results
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionResultsList'
          description: ''
  /api/v1/results/submissions/{id}:
    get:
      operationId: results_submissions_retrieve
      description: List and retrieve the paid submissions of published theme results.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this submission.
        required: true
      tags:
      - results
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResults'
          description: ''
  /api/v1/submission-sets:
    get:
      operationId: submission_sets_list
      description: Upload, list and delete the requester's submission sets.
      parameters:
      - in: query
        name: contest
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - submission-sets
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionSetList'
          description: ''
    post:
      operationId: submission_sets_create
      description: |-
        Enter an upload's submissions and their set atomically.

        A request that repeats the Idempotency-Key of the requester's earlier
        upload creates nothing and returns that upload's set. Once all of its
        submissions are deleted, the request is entered as a new upload.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: Identifies the upload, so that a retry after a lost response
          returns the submission set instead of entering it again.
      tags:
      - submission-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionSetCreateRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSet'
          description: The set of the requester's earlier upload with this Idempotency-Key.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSet'
          description: ''
  /api/v1/submission-sets/{id}:
    get:
      operationId: submission_sets_retrieve
      description: Upload, list and delete the requester's submission sets.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this submission set.
        required: true
      tags:
      - submission-sets
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSet'
          description: ''
    delete:
      operationId: submission_sets_destroy
      description: |-
        Delete a set and its submissions while its contest accepts entries.

        Superusers may delete any set until the results are published.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this submission set.
        required: true
      tags:
      - submission-sets
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/submissions:
    get:
      operationId: submissions_list
      description: List and delete the requester's own submissions.
      parameters:
      - in: query
        name: contest
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - submissions
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionList'
          description: ''
  /api/v1/submissions/{id}:
    delete:
      operationId: submissions_destroy
      description: List and delete the requester's own submissions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this submission.
        required: true
      tags:
      - submissions
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tokens:
    post:
      operationId: tokens_create
      description: Issue a token for valid account credentials.
      tags:
      - tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
  /api/v1/tokens/current:
    delete:
      operationId: tokens_current_destroy
      description: Expire the caller's token, and no other, and answer without a body.
      tags:
      - tokens
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users:
    post:
      operationId: users_create
      description: Register an account, answering alike whether the address had one.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
components:
  schemas:
    ActivationRequest:
      type: object
      description: Activate the account referenced by a signed token.
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    Author:
      type: object
      description: Serializer for Author objects.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        first_name:
          type: string
          maxLength: 30
        last_name:
          type: string
          maxLength: 30
        email:
          type: string
          nullable: true
          description: Return author's email for superusers, ``None`` field otherwise.
          readOnly: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        school:
          type: string
          nullable: true
          maxLength: 100
        mentor:
          type: string
          nullable: true
          maxLength: 100
        club:
          type: string
          nullable: true
          maxLength: 100
        distinction:
          type: string
          nullable: true
          maxLength: 100
      required:
      - created
      - email
      - first_name
      - id
      - last_name
      - modified
    AuthorRequest:
      type: object
      description: Serializer for Author objects.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 30
        last_name:
          type: string
          minLength: 1
          maxLength: 30
        date_of_birth:
          type: string
          format: date
          nullable: true
        school:
          type: string
          nullable: true
          maxLength: 100
        mentor:
          type: string
          nullable: true
          maxLength: 100
        club:
          type: string
          nullable: true
          maxLength: 100
        distinction:
          type: string
          nullable: true
          maxLength: 100
      required:
      - first_name
      - last_name
    AuthorResults:
      type: object
      description: Serialize the author details that published results show to anyone.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 30
        last_name:
          type: string
          maxLength: 30
        school:
          type: string
          nullable: true
          maxLength: 100
        club:
          type: string
          nullable: true
          maxLength: 100
        reward:
          type: string
          readOnly: true
          nullable: true
        reward_theme:
          type: integer
          readOnly: true
          nullable: true
        country:
          type: string
          nullable: true
          description: Return the optional country supplied by the host user model.
          readOnly: true
      required:
      - country
      - first_name
      - id
      - last_name
      - reward
      - reward_theme
    Contest:
      type: object
      description: Serializer for Contest objects.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        themes:
          type: array
          items:
            $ref: '#/components/schemas/Theme'
          readOnly: true
        header_image:
          type: string
          format: uri
          nullable: true
        notice_html:
          type: string
        confirmation_html:
          type: string
        date_of_birth_required:
          type: boolean
        club_visible:
          type: boolean
        club_required:
          type: boolean
        school_visible:
          type: boolean
        school_required:
          type: boolean
      required:
      - created
      - end_date
      - id
      - modified
      - start_date
      - themes
      - title
    File:
      type: object
      description: Serializer for File objects.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        file:
          type: string
          format: uri
        thumbnail:
          type: string
          format: uri
          nullable: true
      required:
      - created
      - file
      - id
      - modified
    Institution:
      type: object
      description: Serializer for Institution objects.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          allOf:
          - $ref: '#/components/schemas/InstitutionKindEnum'
          minimum: -32768
          maximum: 32767
      required:
      - created
      - id
      - kind
      - modified
      - name
    InstitutionKindEnum:
      enum:
      - 1
      type: integer
      description: '* `1` - School'
    JudgeContest:
      type: object
      description: Serializer for Contest objects.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        themes:
          type: array
          items:
            $ref: '#/components/schemas/JudgeTheme'
          readOnly: true
        header_image:
          type: string
          format: uri
          nullable: true
        notice_html:
          type: string
        confirmation_html:
          type: string
        date_of_birth_required:
          type: boolean
        club_visible:
          type: boolean
        club_required:
          type: boolean
        school_visible:
          type: boolean
        school_required:
          type: boolean
      required:
      - created
      - end_date
      - id
      - modified
      - start_date
      - themes
      - title
    JudgeSubmission:
      type: object
      description: Serialize a submission for judging, without its author.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        theme:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
          nullable: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
          readOnly: true
      required:
      - created
      - description
      - files
      - id
      - modified
      - theme
      - title
    JudgeTheme:
      type: object
      description: Serializer for Theme objects.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 100
        is_series:
          type: boolean
        max_photos:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Number of photos
        submission_count:
          type: integer
          description: Count paid submissions available for judging.
          readOnly: true
        rating_count:
          type: integer
          description: Count ratings submitted by the requesting judge.
          readOnly: true
      required:
      - created
      - id
      - max_photos
      - modified
      - rating_count
      - submission_count
      - title
    LoginRequest:
      type: object
      description: Authenticate an active account.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    PaginatedContestList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
