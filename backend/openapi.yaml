openapi: 3.0.3
info:
  title: Rola API
  version: 1.0.0
  description: Accounts, photography contests, submissions, judging and payments.
paths:
  /api/v1/activations:
    post:
      operationId: activations_create
      description: Activate the account that the token names.
      tags:
      - activations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
