  /api/v1/submission:
    get:
      operationId: submission_list
      description: API view Submission objects.
      parameters:
      - in: query
        name: contest
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: theme
        schema:
          type: integer
      tags:
      - submission
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionList'
          description: ''
    post:
      operationId: submission_create
      description: |-
        Create one coherent submission set, atomically, for either payload shape.

        A request that repeats the Idempotency-Key of the requester's earlier
        upload creates nothing and returns that upload's submissions. Once all
        of them are deleted, the request is entered as a new upload.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: Identifies the upload, so that a retry after a lost response
          returns the submissions instead of entering them again.
      tags:
      - submission
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/SubmissionRequest'
              - type: array
                items:
                  $ref: '#/components/schemas/SubmissionRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SubmissionWrite'
                - type: array
                  items:
                    $ref: '#/components/schemas/SubmissionWrite'
          description: The submissions of the requester's earlier upload with this
            Idempotency-Key; a list when the request body is a list.
        '201':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SubmissionWrite'
                - type: array
                  items:
                    $ref: '#/components/schemas/SubmissionWrite'
          description: A list when the request body is a list.
