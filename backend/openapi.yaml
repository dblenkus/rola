      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionWrite'
          description: ''
    delete:
      operationId: submission_destroy
      description: Delete the requester's submission while its contest accepts entries.
      parameters:
