        schema:
          type: integer
      - in: query
        name: paid
        schema:
          type: boolean
      - in: query
        name: submission_set
        schema:
          type: integer
      - in: query
        name: submission_set__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
