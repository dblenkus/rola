    get:
      operationId: submissionset_retrieve
      description: List and delete the requesting user's submission sets.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this submission set.
        required: true
      tags:
      - submissionset
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSet'
          description: ''
    delete:
      operationId: submissionset_destroy
      description: |-
        Delete a set and its submissions while its contest accepts entries.

        Superusers may delete any set until the results are published.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this submission set.
        required: true
      tags:
      - submissionset
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tokens:
    post:
      operationId: tokens_create
      description: Issue a token for valid account credentials.
      tags:
      - tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
  /api/v1/tokens/current:
    delete:
      operationId: tokens_current_destroy
      description: Expire the caller's token, and no other, and answer without a body.
      tags:
      - tokens
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/users:
    post:
      operationId: users_create
      description: Register an account, answering alike whether the address had one.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          description: No response body
