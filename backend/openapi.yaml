      operationId: results_submission_list
      description: List and retrieve accepted, paid submissions after publication.
      parameters:
      - in: query
        name: contest
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: theme
        schema:
          type: integer
