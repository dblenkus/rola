name: rola-production

x-backend: &backend
  build:
    context: backend
    target: production
  env_file: .env
  environment:
    ROLA_DEBUG: "false"
    ROLA_SECRET_KEY: ${ROLA_SECRET_KEY:?Set ROLA_SECRET_KEY in .env.}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env.}
    ROLA_FRONTEND_URL: ${ROLA_FRONTEND_URL:?Set ROLA_FRONTEND_URL in .env.}
    ROLA_TRUST_PROXY: "true"
    ROLA_NUM_PROXIES: ${ROLA_NUM_PROXIES:?Set ROLA_NUM_PROXIES in .env to the number of proxies in front of Gunicorn.}
    ROLA_POSTGRESQL_HOST: db
    ROLA_POSTGRESQL_PASSWORD: ${ROLA_POSTGRESQL_PASSWORD:?Set ROLA_POSTGRESQL_PASSWORD in .env.}
  volumes:
    - media:/storage/media
    - static:/storage/static

services:
  db:
    image: postgres:18.6-alpine3.24
    # By default, PostgreSQL logs a failed statement and its error's detail
    # with the row's values, such as a participant's name or password hash.
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic]
    environment:
      POSTGRES_USER: rola
      POSTGRES_PASSWORD: ${ROLA_POSTGRESQL_PASSWORD:?Set ROLA_POSTGRESQL_PASSWORD in .env.}
      POSTGRES_DB: rola
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --host=127.0.0.1, --username=rola, --dbname=rola]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput
        && python manage.py createcachetable
        && python manage.py collectstatic --noinput
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, manage.py, readinesscheck]
      interval: 15s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      target: production
      args:
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:?Set VITE_PAYPAL_CLIENT_ID in .env.}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:?Set VITE_SENTRY_DSN in .env.}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - media:/storage/media:ro
      - static:/storage/static:ro
    restart: unless-stopped

volumes:
  db:
  media:
  static:
