name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  backend:
    name: backend (Python ${{ matrix.python }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    env:
      ROLA_SECRET_KEY: ci-only-fake-secret-key
      ROLA_FRONTEND_URL: http://localhost:8080
      ROLA_POSTGRESQL_HOST: 127.0.0.1
      ROLA_POSTGRESQL_PORT: "55432"
      ROLA_POSTGRESQL_PASSWORD: rola
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
          working-directory: backend
      - name: Start PostgreSQL
        run: make db
      - run: make backend-sync
      - name: Test on SQLite
        run: make backend-test
      - name: Test on PostgreSQL
        run: make backend-test-postgresql
      - run: make backend-system-check
      - run: make backend-migrations-check
      - name: Migrate an empty PostgreSQL database
        run: make backend-migrate

  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.14"
          working-directory: backend
      - run: make backend-lock-check
      - run: make backend-sync
      - name: Lint the backend and docs/conf.py
        run: make backend-lint
      - name: Check the formatting of the backend and docs/conf.py
        run: make backend-format
      - run: make backend-types
      - name: Build the documentation
        run: make docs DOCS_BUILD="$RUNNER_TEMP/docs"
      - name: Check the wheel in a clean environment
        working-directory: backend
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$RUNNER_TEMP/venv" --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          DJANGO_SETTINGS_MODULE=rola.config.test_settings venv/bin/python -I - <<'PY'
          import django
          from django.core.management import call_command
          from django.template.loader import get_template
          from django.utils import translation

          django.setup()

          from rola.contests.models import Contest

          call_command("check")
          call_command("migrate", verbosity=0)
          Contest.objects.exists()
          with translation.override("sl"):
              assert str(Contest._meta.verbose_name) == "natečaj"
          for purpose in ("registration", "password_reset", "existing_account"):
              for name in ("email_subject.txt", "email_body.txt", "email_body.html"):
                  get_template(f"accounts/{purpose}/{name}")
          PY
      - name: Audit the locked runtime dependencies
        run: make backend-audit AUDIT_REQUIREMENTS="$RUNNER_TEMP/audit.txt"

  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install
      - run: make frontend-lint
      - run: make frontend-format
      - run: make frontend-typecheck
      - run: make frontend-test
      - run: make frontend-build
      - run: make frontend-deps
      - run: make frontend-audit

  api-contract:
    runs-on: ubuntu-26.04
    env:
      ROLA_SECRET_KEY: ci-only-fake-secret-key
      ROLA_FRONTEND_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.14"
          working-directory: backend
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - name: Generate the OpenAPI schema with the PostgreSQL backend
        run: make api-schema
      - run: git diff --exit-code -- backend/openapi.yaml
      - run: make frontend-install
      - run: make api-types
      - run: git diff --exit-code -- frontend/src/shared/api/generated-api.ts

  images:
    name: images (${{ matrix.component }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the development image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.component }}
          target: development
      - name: Build the production image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.component }}
          target: production
          build-args: |
            VITE_SENTRY_DSN=https://ci-fake-key@sentry.invalid/1
          load: ${{ matrix.component == 'frontend' }}
          tags: rola-${{ matrix.component }}:ci
      - name: Check the frontend's script policy against its page
        if: matrix.component == 'frontend'
        run: |
          docker run --detach --publish 127.0.0.1:8080:8080 rola-frontend:ci
          # nginx may still be starting when the published port answers.
          curl --silent --show-error --fail --retry 10 --retry-all-errors \
            --dump-header headers.txt --output index.html http://127.0.0.1:8080/
          curl --silent --show-error --fail \
            --dump-header headers-2.txt --output /dev/null http://127.0.0.1:8080/
          # Each response carries one policy, with a nonce of 32 lowercase
          # hexadecimal digits that the next response does not repeat.
          for response in headers headers-2; do
            tr -d '\r' < "$response.txt" \
              | grep --ignore-case '^content-security-policy: ' \
              | cut --delimiter=' ' --fields=2- > "$response-policy.txt"
            test "$(wc --lines < "$response-policy.txt")" -eq 1
            grep --line-regexp --extended-regexp \
              "script-src 'self' 'nonce-[0-9a-f]{32}'; object-src 'none'; base-uri 'self'; form-action 'self'" \
              "$response-policy.txt"
          done
          if cmp --silent headers-policy.txt headers-2-policy.txt; then
            exit 1
          fi
          # The policy refuses inline scripts and scripts from other hosts,
          # so the page may only load scripts from its own paths.
          grep --only-matching --ignore-case '<script[^>]*>' index.html > scripts.txt
          if grep --invert-match --extended-regexp ' src="/[^/"][^"]*"' scripts.txt; then
            exit 1
          fi

  compose:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose -f compose.yaml config --quiet
      - name: Check compose.production.yaml with fake settings
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          ROLA_SECRET_KEY=ci-only-fake-secret-key
          ALLOWED_HOSTS=localhost
          ROLA_FRONTEND_URL=https://localhost
          ROLA_POSTGRESQL_PASSWORD=ci-only-fake-password
          ROLA_NUM_PROXIES=2
          VITE_SENTRY_DSN=https://ci-fake-key@sentry.invalid/1
          EOF
          docker compose -f compose.production.yaml config --quiet
      - name: Check compose.tunnel.yaml merged into the production stack
        run: |
          echo 'TUNNEL_TOKEN=ci-only-fake-token' >> .env
          docker compose -f compose.production.yaml -f compose.tunnel.yaml config --quiet
          docker compose -f compose.production.yaml -f compose.tunnel.yaml config --format json |
            jq --exit-status '
              (.services.frontend.ports // []) == []
              and .services.migrate.environment.TUNNEL_TOKEN == ""
              and .services.backend.environment.TUNNEL_TOKEN == ""
              and .services.tunnel.environment.TUNNEL_TOKEN == "ci-only-fake-token"
              and (.services.frontend.networks | keys) == ["default", "tunnel"]
              and ([.services | to_entries[] | select(.value.networks | has("tunnel")) | .key] | sort)
                == ["frontend", "tunnel"]'

  github-config:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lint the workflows
        run: make actionlint
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
      - name: Validate the Dependabot configuration
        run: make dependabot-config
