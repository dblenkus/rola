name: build

on:
  push:
    branches: [master]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: rolca
          POSTGRES_DB: rolca
          POSTGRES_PASSWORD: rolca
        ports: ["5432/tcp"]
        options: --health-cmd "pg_isready -U rolca" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:8.10.1-alpine
        ports: ["6379/tcp"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      ROLCA_POSTGRESQL_PORT: ${{ job.services.postgres.ports[5432] }}
      ROLCA_POSTGRESQL_PASSWORD: rolca
      ROLCA_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports[6379] }}/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: python -m pytest -W error::DeprecationWarning --cov=rolca --cov-report=xml
      - run: python tests/manage.py check
      - run: python tests/manage.py makemigrations --check --dry-run
      - run: python tests/manage.py migrate --noinput
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.codecov_token }}
          files: coverage.xml
          flags: python-${{ matrix.python }}

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[docs,lint,package]'
      - run: python -m pip check
      - run: python -m tox -e linters,docs,packaging

  publish:
    runs-on: ubuntu-24.04
    needs: [test, quality]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install '.[package]'
      - run: python -m build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.test_pypi_password }}
          repository-url: https://test.pypi.org/legacy/
