map $request_uri $request_path {
    ~^(?<path_only>[^?]*) $path_only;
}

log_format path_only '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $request_path $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent" '
                     '"$http_x_forwarded_for"';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log path_only;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header_inherit merge;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The nonce is for a proxy or CDN that injects an inline script and reads
    # the nonce from this header (Cloudflare's JavaScript Detections); the
    # application's own pages use none. $request_id is 16 bytes from OpenSSL's
    # RAND_bytes, new for every response. The HTML document, which carries the
    # injected script, must therefore never be reused: a stored copy, whether
    # replayed by a shared cache or revalidated with a 304, shows its old nonce
    # under another response's policy. The location for /index.html below
    # forbids every cache to store it, and answers a revalidation by its
    # Last-Modified or by its former ETag with the page instead of 304.
    add_header Content-Security-Policy "script-src 'self' 'nonce-$request_id'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(api|django-admin) {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_max_temp_file_size 4096m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        add_header_inherit off;
        gzip off;
    }

    location /static2/ {
        alias /storage/static/;
    }

    location /media/ {
        alias /storage/media/;
        expires 365d;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control no-cache;
    }

    location = /index.html {
        add_header Cache-Control no-store;
        if_modified_since off;
        etag off;
    }
}
