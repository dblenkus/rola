map $request_uri $request_path {
    ~^(?<path_only>[^?]*) $path_only;
}

log_format path_only '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $request_path $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent" '
                     '"$http_x_forwarded_for"';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log path_only;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header_inherit merge;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api|django-admin) {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_max_temp_file_size 4096m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        add_header_inherit off;
        gzip off;
    }

    location /static2/ {
        alias /storage/static/;
    }

    location /media/ {
        alias /storage/media/;
        expires 365d;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control no-cache;
    }
}
